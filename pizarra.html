<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f0f0f"><title>Argentas · Pizarra de Comandas</title><style>*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(390px,100%);background:#181818;border:1px solid #333;border-radius:22px;padding:24px;box-shadow:0 20px 70px #000}.logo{font-size:28px;font-weight:1000;color:#E8B84A}.sub{font-size:11px;color:#999;letter-spacing:.12em;margin:4px 0 22px}label{display:block;font-size:11px;color:#aaa;font-weight:900;margin:13px 0 6px}input{width:100%;height:48px;border:1px solid #444;border-radius:12px;background:#0b0b0b;color:#fff;padding:0 13px;outline:none}.btn{width:100%;height:48px;border:0;border-radius:12px;background:#E8B84A;color:#111;font-weight:1000;cursor:pointer;margin-top:16px}.err{display:none;color:#ff7777;font-size:11px;margin-top:10px;font-weight:800}#app{display:none}.head{position:sticky;top:0;z-index:5;background:rgba(15,15,15,.96);border-bottom:1px solid #292929;padding:14px}.head-in{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:21px;font-weight:1000;color:#E8B84A}.status{font-size:9px;color:#999;margin-top:3px;letter-spacing:.08em}.head-actions{display:flex;gap:7px}.smallbtn{border:1px solid #444;border-radius:10px;background:#222;color:#fff;padding:9px 10px;font-size:10px;font-weight:900}main{max-width:1100px;margin:auto;padding:14px}.info{background:#181818;border:1px solid #303030;border-radius:13px;padding:10px 12px;margin-bottom:12px;color:#aaa;font-size:10px}.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{background:#181818;border:2px solid #303030;border-radius:15px;padding:13px}.card.prep{border-color:#E <section id="login"><div class="box"><div class="logo">ARGENTAS</div><div class="sub">PIZARRA DE COMANDAS ONLINE</div><label>USUARIO</label><input id="user" autocomplete="username" autocapitalize="none"><label>CONTRASEÑA</label><input id="pass" type="password" autocomplete="current-password"><button class="btn" id="loginBtn">INGRESAR</button><div class="err" id="loginErr">Usuario o contraseña incorrectos.</div></div></section>
<section id="app"><header class="head"><div class="head-in"><div><div class="title">ARGENTAS · PIZARRA</div><div class="status" id="status">CONECTANDO…</div></div><div class="head-actions"><button class="smallbtn" id="refreshBtn">↻ ACTUALIZAR</button><button class="smallbtn" id="logoutBtn">SALIR</button></div></div></header><main><div class="info" id="info">Buscando comandas…</div><div class="grid" id="orders"></div></main></section>
<script>
(function(){'use strict';
var SUPABASE_URL='https://blnoenkmshrybsqpsvtx.supabase.co',TABLE='argentas_conexion',USER='Argentas',PASS_HASH='',BRIDGE='',BUILD='pizarra-status-v2',PIZARRA_DEVICE_ID=localStorage.getItem('argentas_pizarra_device_id')||('pizarra_'+Date.now()+'_'+Math.random().toString(36).slice(2,10));localStorage.setItem('argentas_pizarra_device_id',PIZARRA_DEVICE_ID);
var login=document.getElementById('login'),app=document.getElementById('app'),oe=document.getElementById('orders'),se=document.getElementById('status'),ie=document.getElementById('info'),orders={},SUPABASE_KEY='sb_publishable_OmZ_iwMzQNUDeyTJXOjBqw_au5UgLN8';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function money(n){return '$'+(Number(n)||0).toLocaleString('es-AR')}function age(ms){var m=Math.max(0,Math.floor(ms/60000));return m<60?m+' min':Math.floor(m/60)+' h '+m%60+' min'}
function merge(o){if(!o||!o.id||o.status==='oculta')return;var id=String(o.id),c=orders[id];if(!c){orders[id]=JSON.parse(JSON.stringify(o));return}var lu=Number(c.updatedAt||c.createdAt||0),ru=Number(o.updatedAt||o.createdAt||0);if(ru>=lu)Object.keys(o).forEach(function(k){c[k]=o[k]});var ls=Number(c.statusUpdatedAt||c.updatedAt||c.createdAt||0),rs=Number(o.statusUpdatedAt||o.updatedAt||o.createdAt||0);if(rs>ls||(rs===ls&&String(o.statusDeviceId||'')>String(c.statusDeviceId||''))){c.status=o.status;c.statusUpdatedAt=o.statusUpdatedAt;c.statusDeviceId=o.statusDeviceId||''}}
function apply(raw){
  try{
    var m=JSON.parse(raw);
    if(m.type==='state'&&m.db&&Array.isArray(m.db.orders)){
      orders={};
      m.db.orders.forEach(merge);
    }else if(m.type==='vender-sale'&&m.sale){
      var s=m.sale,
          id='v'+String(s.comandaId||s.id),
          o=orders[id];
      if(!o){
        var lines=(s.items||[]).map(function(x){
          return{
            productId:String(x.productId||x.id||''),
            name:String(x.name||''),
            price:Number(x.price)||0,
            qty:Number(x.qty)||0,
            note:String(x.note||''),
            noLechuga:!!x.noLechuga,
            noTomate:!!x.noTomate,
            cheese:String(x.cheese||'')
          };
        }).filter(function(x){return x.qty>0});
        if(lines.length){
          var max=Object.keys(orders).reduce(function(n,k){
            return Math.max(n,Number(orders[k].number)||0);
          },0);
          var stamp=s.timestamp?new Date(s.timestamp).getTime():Date.now();
          orders[id]={
            id:id,
            number:max+1,
            day:new Date(stamp).toISOString().slice(0,10),
            lines:lines,
            total:Number(s.total)||0,
            status:'recibido',
            createdAt:stamp,
            updatedAt:stamp,
            source:'vender',
            venderSaleId:String(s.id||'')
          };
        }
      }
      ackVenderSale(m.deliveryId||('vender-sale:'+String(s.id||'')));
    }else if(m.type==='comanda-status'&&m.id&&m.status){
      var c=orders[String(m.id)];
      if(c){
        var rs=Number(m.statusUpdatedAt||0),
            ls=Number(c.statusUpdatedAt||c.updatedAt||c.createdAt||0);
        if(rs>ls||(rs===ls&&String(m.statusDeviceId||'')>String(c.statusDeviceId||''))){
          c.status=m.status;
          c.statusUpdatedAt=rs;
          c.statusDeviceId=m.statusDeviceId||'';
          c.updatedAt=Math.max(Number(c.updatedAt||0),Number(m.updatedAt||0),rs);
        }
      }
    }
  }catch(e){}
}
async function postTransportMessage(raw){
  var key=await loadKey();
  var r=await fetch(SUPABASE_URL+'/rest/v1/'+TABLE,{
    method:'POST',
    headers:{apikey:key,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({dispositivo:'celular',device_id:PIZARRA_DEVICE_ID,mensaje:String(raw)})
  });
  if(!r.ok)throw Error('HTTP '+r.status);
  return true;
}
function ackVenderSale(deliveryId){
  if(!deliveryId)return;
  postTransportMessage(JSON.stringify({type:'vender-ack',deliveryId:String(deliveryId)})).catch(function(){});
}
async function loadKey(){return SUPABASE_KEY}
async function refresh(){try{se.textContent='CONECTANDO…';var key=await loadKey(),q=SUPABASE_URL+'/rest/v1/'+TABLE+'?select=mensaje,created_at&order=created_at.desc&limit=500',r=await fetch(q,{headers:{apikey:key}});if(!r.ok)throw Error('HTTP '+r.status);var rows=await r.json();orders={};rows.reverse().forEach(function(x){if(x&&x.mensaje)apply(x.mensaje)});render();se.textContent='● CONECTADO · '+new Date().toLocaleTimeString('es-AR')}catch(e){se.textContent='● ERROR DE CONEXIÓN';ie.textContent='No se pudo actualizar la pizarra. Se reintentará automáticamente.'}}
function render(){var list=Object.keys(orders).map(function(k){return orders[k]}).filter(function(o){return o.status!=='oculta'&&o.status!=='entregada'&&o.status!=='cancelada'}).sort(function(a,b){return Number(a.createdAt||0)-Number(b.createdAt||0)});if(!list.length){oe.innerHTML='<div class="empty">No hay comandas pendientes.</div>';ie.textContent='Sin comandas pendientes';return}var now=Date.now();oe.innerHTML=list.map(function(o){var am=Math.max(0,now-Number(o.createdAt||now)),mins=Math.floor(am/60000),a20=mins>=20,a30=mins>=30,s=o.status||'recibido',cl=s==='preparando'?'prep':'received';if(a20)cl+=' alert20';if(a30)cl+=' alert30';var bd=a30?'🚨 +30 MIN · DEMORADA':a20?'⚠️ +20 MIN':(s==='preparando'?'EN PREPARACIÓN':'RECIBIDO'),bc=a30?'urgent':(a20?'alert':(s==='preparando'?'prep':'')),ls=Array.isArray(o.lines)?o.lines:Array.isArray(o.items)?o.items:[],lh=ls.map(function(l){var n=l.note||l.observacion||l.obs||'';return '<div class="line"><span class="qty">'+esc(l.qty||l.quantity||1)+'×</span> <span class="name">'+esc(l.name||l.productName||'Producto')+'</span>'+(n?'<div class="note">'+esc(n)+'</div>':'')+'</div>'}).join('');var next=s==='recibido'?'preparando':(s==='preparando'?'entregada':'oculta'),nextLabel=next==='preparando'?'EN PREPARACIÓN':(next==='entregada'?'ENTREGAR':'OCULTAR');return '<article class="card '+cl+'"><div class="top"><div><div class="num">COMANDA #'+esc(o.number||o.id)+'</div><span class="badge '+bc+'">'+esc(bd)+'</span></div><div class="time">'+new Date(Number(o.createdAt||Date.now())).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+'<br><span class="age">+'+age(am)+'</span></div></div><div class="lines">'+(lh||'<div class="note">Sin detalle de productos</div>')+'</div><div class="foot"><span class="age">'+esc(o.customerName||o.cliente||'')+'</span><span class="total">'+money(o.total)+'</span></div><button class="smallbtn statusbtn" data-status-id="'+esc(o.id)+'" data-status-next="'+esc(next)+'">'+esc(nextLabel)+'</button></article>'}).join('');ie.textContent=list.length+' comanda'+(list.length===1?'':'s')+' pendiente'+(list.length===1?'':'s')+' · actualización automática'}
async function sendStatus(o,status){var ts=Date.now();try{var raw=JSON.stringify({type:'comanda-status',deliveryId:'piz:'+String(o.id)+':'+String(ts),id:String(o.id),status:status,statusUpdatedAt:ts,updatedAt:ts,statusDeviceId:PIZARRA_DEVICE_ID});await postTransportMessage(raw);o.status=status;o.statusUpdatedAt=ts;o.statusDeviceId=PIZARRA_DEVICE_ID;o.updatedAt=ts;render()}catch(e){alert('No se pudo actualizar el estado de la comanda.')}}
function enter(){var u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;if(u===USER&&p==='Comandas2026'){sessionStorage.setItem('argentas_pizarra_auth','1');login.style.display='none';app.style.display='block';refresh()}else document.getElementById('loginErr').style.display='block'}
if(sessionStorage.getItem('argentas_pizarra_auth')==='1'){login.style.display='none';app.style.display='block';refresh()}
document.getElementById('loginBtn').onclick=enter;document.getElementById('pass').onkeydown=function(e){if(e.key==='Enter')enter()};document.getElementById('user').onkeydown=function(e){if(e.key==='Enter')enter()};document.getElementById('refreshBtn').onclick=refresh;oe.onclick=function(e){var b=e.target.closest('[data-status-id]');if(!b)return;var o=orders[String(b.getAttribute('data-status-id'))];if(!o)return;sendStatus(o,b.getAttribute('data-status-next'))};document.getElementById('logoutBtn').onclick=function(){sessionStorage.removeItem('argentas_pizarra_auth');location.reload()};setInterval(function(){if(app.style.display==='block')refresh()},5000);
})();</script></body></html>
