name: Build Argentas 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Argentas 2
        uses: actions/checkout@v4
      - name: Importar base histórica
        run: |
          git clone --depth 1 --branch feature/bluetooth-base https://github.com/Trotabares1978/Argentas-Comandas.git /tmp/argentas-base
          rsync -a --exclude='.git' --exclude='.github' /tmp/argentas-base/ ./
      - name: Preservar artefactos de Argentas 2
        run: |
          mkdir -p source/v2 docs
          test -f source/sync-engine.js
          test -f docs/SYNC_PROTOCOL.md
      - name: Preparar
        run: python3 scripts/prepare_v2.py
      - name: Validar fuente
        run: |
          test -s app/src/main/assets/index.html
          grep -q "CALCULADORA DE COBRO" app/src/main/assets/index.html
          grep -q "Argentas 2 — motor de sincronización" app/src/main/assets/index.html
          node --check source/sync-engine.js
          grep -q 'data-bill=\"10000\"' app/src/main/assets/index.html
          grep -q 'data-bill=\"20000\"' app/src/main/assets/index.html
          grep -q "argentasPaymentGate" app/src/main/assets/index.html
          grep -q "setStatus(id,'oculta')" app/src/main/assets/index.html
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Argentas-2-debug
          path: app/build/outputs/apk/debug/app-debug.apk