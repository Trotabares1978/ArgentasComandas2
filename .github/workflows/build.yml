# Re-trigger build to verify APK artifact publication.
name: Build Argentas

concurrency:
  group: argentas-build
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Argentas
        run: python3 scripts/prepare_argentas.py

      - name: Fix monthly closure summary detection
        run: python3 scripts/patch_monthly_history.py

      - name: Stage 3 - isolate sync reconciliation
        run: python3 scripts/refactor_sync_reconcile.py

      - name: Patch WhatsApp Caja
        run: python3 scripts/patch_whatsapp_directo.py

      - name: Prepare icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON="app/src/main/res/drawable/argentas_icon.png"
          convert "$ICON" -fuzz 8% -transparent "#ff00ff" -trim +repage -resize 512x512 "$ICON"

      - name: Validate source
        run: |
          test -s app/src/main/assets/index.html
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          html=Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          for i,script in enumerate(scripts):
              p=Path(f"/tmp/argentas-script-{i}.js")
              p.write_text(script,encoding="utf-8")
              subprocess.run(["node","--check",str(p)],check=True)
          print(f"Validated {len(scripts)} embedded scripts")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Argentas-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
            gh release edit latest --title "Argentas — última versión" --notes "Build ${{ github.run_number }} · Commit ${{ github.sha }}"
          else
            gh release create latest --target "${GITHUB_SHA}" --title "Argentas — última versión" --notes "Build ${{ github.run_number }} · Commit ${{ github.sha }}"
            gh release upload latest "$APK" --clobber
          fi
