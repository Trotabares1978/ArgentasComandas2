name: Build Argentas

concurrency:
  group: argentas-build
  cancel-in-progress: true

on:
  push:
    branches: [main, supabase-online]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Argentas
        env:
          ARGENTAS_TRANSPORT: ${{ github.ref_name == 'supabase-online' && 'supabase' || 'bluetooth' }}
        run: python3 scripts/prepare_argentas.py

      - name: Verify transport
        run: |
          if [ "${GITHUB_REF_NAME}" = "supabase-online" ]; then
            grep -q "blnoenkmshrybsqpsvtx.supabase.co" app/src/main/assets/index.html
            grep -q "ARGENTAS_SUPABASE_TRANSPORT" app/src/main/assets/index.html
            grep -q "ARGENTAS · COMANDAS" app/src/main/assets/index.html
            grep -q "function setStatus" app/src/main/assets/index.html
            grep -q "statusUpdatedAt" app/src/main/assets/index.html
            grep -q "function sync" app/src/main/assets/index.html
            ! grep -q "sendStatus" app/src/main/assets/index.html
            ! grep -q "onArgentasStatusMessage" app/src/main/assets/index.html
            ! grep -q "function sendComandaStatus" app/src/main/assets/index.html
            ! grep -q "order-update" app/src/main/assets/index.html
            ! grep -q "PROBAR NEARBY" app/src/main/assets/index.html
            grep -q "comanda-status" app/src/main/assets/index.html
            grep -q "argentas_comanda_status_pending_v2" app/src/main/assets/index.html
            grep -q "m.type==='reconcile-request'" app/src/main/assets/index.html
            grep -q "knownOrders=Array.isArray(m.knownOrders)" app/src/main/assets/index.html
            grep -q "var saleItems=Array.isArray(s.items)&&s.items.length" app/src/main/assets/index.html
            ! grep -q "if(existing){if(!lines.length){var ei=db.orders.indexOf(existing);if(ei>=0)db.orders.splice(ei,1)" app/src/main/assets/index.html
            ! grep -q "ArgentasNativeBluetooth" app/src/main/assets/index.html
            ! grep -q "onBluetoothMessage" app/src/main/assets/index.html
            echo "OK: original Argentas UI + Supabase transport + dedicated comanda status queue"
          fi

      - name: Validate Pizarra mirror reconciliation
        if: github.ref_name == 'supabase-online'
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          html=Path("pizarra.html").read_text(encoding="utf-8")
          required = [
              "snapshots.forEach(function(x){apply(x.row.mensaje,true)})",
              "if(rev>0&&rev<=seenRev&&!forceSnapshot)return;",
              "merged.preparingAt=statusWinner===remote&&remotePrep>0?remotePrep:(localPrep||remotePrep||0)",
              "Sin estado actual de la aplicación · se conservan las comandas conocidas",
          ]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit("Pizarra regression guards failed: "+", ".join(missing))
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",html,flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No se encontró el script de Pizarra")
          for i,script in enumerate(scripts):
              p=Path(f"/tmp/pizarra-script-{i}.js")
              p.write_text(script,encoding="utf-8")
              subprocess.run(["node","--check",str(p)],check=True)
          merge_match=re.search(r"function merge\(o\)\{[\s\S]*?\n\}",html)
          if not merge_match:
              raise SystemExit("No se encontró la función merge de Pizarra")
          test_js="""const assert=require('assert'); const orders={};
          """+merge_match.group(0)+"""
          merge({id:'test-1',createdAt:10,updatedAt:200,status:'preparando',statusUpdatedAt:200,statusDeviceId:'a',preparingAt:150,lines:[]});
          merge({id:'test-1',createdAt:10,updatedAt:300,status:'recibido',statusUpdatedAt:100,statusDeviceId:'b',preparingAt:0,lines:[]});
          assert.strictEqual(orders['test-1'].status,'preparando');
          assert.strictEqual(Number(orders['test-1'].preparingAt),150);
          merge({id:'test-1',createdAt:10,updatedAt:400,status:'preparando',statusUpdatedAt:400,statusDeviceId:'c',preparingAt:400,lines:[]});
          assert.strictEqual(Number(orders['test-1'].preparingAt),400);
          merge({id:'test-2',createdAt:20,updatedAt:20,status:'recibido',statusUpdatedAt:20,lines:[]});
          assert.ok(orders['test-1']&&orders['test-2']);
          """
          test_path=Path("/tmp/pizarra-merge-regression.js")
          test_path.write_text(test_js,encoding="utf-8")
          subprocess.run(["node",str(test_path)],check=True)
          print(f"Validated {len(scripts)} Pizarra script(s), {len(required)} static guards and merge regression cases")
          PY

      - name: Prepare icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON="app/src/main/res/drawable/argentas_icon.png"
          convert "$ICON" -fuzz 8% -transparent "#ff00ff" -trim +repage -resize 512x512 "$ICON"

      - name: Validate source
        run: |
          test -s app/src/main/assets/index.html
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          html=Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          for i,script in enumerate(scripts):
              p=Path(f"/tmp/argentas-script-{i}.js")
              p.write_text(script,encoding="utf-8")
              subprocess.run(["node","--check",str(p)],check=True)
          print(f"Validated {len(scripts)} embedded scripts")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Argentas-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
            gh release edit latest --title "Argentas — última versión" --notes "Build ${{ github.run_number }} · Commit ${{ github.sha }}"
          else
            gh release create latest --target "${GITHUB_SHA}" --title "Argentas — última versión" --notes "Build ${{ github.run_number }} · Commit ${{ github.sha }}"
            gh release upload latest "$APK" --clobber
          fi
