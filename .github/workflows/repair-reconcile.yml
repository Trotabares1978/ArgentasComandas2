name: Repair Argentas reconcile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply reconcile repair
        run: python3 scripts/fix_reconcile_state.py
      - name: Commit repair when needed
        run: |
          if git diff --quiet -- source/argentas-original-07.part; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/argentas-original-07.part
          git commit -m "Corregir procesamiento de estados tras cotejo"
          git push
