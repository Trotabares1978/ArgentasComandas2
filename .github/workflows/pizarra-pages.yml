name: Deploy Argentas Pizarra

on:
  push:
    branches: [supabase-online]
    paths:
      - "pizarra.html"
      - "scripts/test_pizarra_sync.py"
      - ".github/workflows/pizarra-pages.yml"
  pull_request:
    branches: [supabase-online]
    paths:
      - "pizarra.html"
      - "scripts/test_pizarra_sync.py"
      - ".github/workflows/pizarra-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: argentas-pizarra-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Pizarra synchronization
        run: |
          python3 scripts/test_pizarra_sync.py
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          html = Path("pizarra.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No se encontró JavaScript en pizarra.html")
          for i, script in enumerate(scripts):
              path = Path(f"/tmp/pizarra-script-{i}.js")
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Validated {len(scripts)} embedded Pizarra script(s)")
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: argentas-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp pizarra.html _site/pizarra.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages (retry-safe)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
