<script>
(function(){
'use strict';
if(window.__ARGENTAS_SUPABASE_TRANSPORT__)return;
window.__ARGENTAS_SUPABASE_TRANSPORT__=true;
var SUPABASE_URL='https://blnoenkmshrybsqpsvtx.supabase.co';
var SUPABASE_KEY='sb_publishable_OmZ_iwMzQNUDeyTJXOjBqw_au5UgLN8';
var SUPABASE_TABLE='argentas_conexion';
var STATUS_TABLE='argentas_comanda_status';
var DEVICE_ID=localStorage.getItem('argentas_supabase_device_id')||('d_'+Date.now()+'_'+Math.random().toString(36).slice(2,10));
var DEVICE_ROLE=window.innerWidth>=600?'tablet':'celular';
localStorage.setItem('argentas_supabase_device_id',DEVICE_ID);
var ws=null,joined=false,reconnectTimer=null,heartbeatTimer=null,closing=false,lastRecoveryAt=0;
function state(s,m){try{window.argentasConnectionState=s}catch(e){}try{if(typeof window.onSupabaseState==='function')window.onSupabaseState(s,m||'')}catch(e){}}
function message(m){try{if(typeof window.onSupabaseMessage==='function')window.onSupabaseMessage(String(m||''))}catch(e){console.warn('Argentas Supabase message error',e)}}
async function postMessage(raw){
var res=await fetch(SUPABASE_URL+'/rest/v1/'+SUPABASE_TABLE,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({dispositivo:DEVICE_ROLE,device_id:DEVICE_ID,mensaje:String(raw)})});
if(!res.ok)throw new Error('HTTP '+res.status);
}
async function postStatus(ev){
var res=await fetch(SUPABASE_URL+'/rest/v1/'+STATUS_TABLE,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({event_id:String(ev.event_id),order_id:String(ev.order_id),status:String(ev.status),status_updated_at:Number(ev.status_updated_at),device_id:DEVICE_ID})});
if(!res.ok)throw new Error('HTTP '+res.status);
}
async function recoverRecent(){
try{
var since=Number(localStorage.getItem('argentas_supabase_last_recovery')||0),cutoff=Math.max(since-120000,Date.now()-7*24*60*60*1000);
var q=SUPABASE_URL+'/rest/v1/'+SUPABASE_TABLE+'?select=id,dispositivo,device_id,mensaje,created_at&created_at=gt.'+encodeURIComponent(new Date(cutoff).toISOString())+'&order=created_at.asc&limit=500';
var res=await fetch(q,{headers:{'apikey':SUPABASE_KEY}});if(!res.ok)throw new Error('HTTP '+res.status);
var rows=await res.json();rows.forEach(function(row){var sender=String(row.device_id||''),same=sender?sender===DEVICE_ID:String(row.dispositivo||'')===DEVICE_ROLE;if(!same&&row.mensaje){try{var parsed=JSON.parse(row.mensaje),type=String(parsed.type||'');if(type&&type!=='hello'&&type!=='hello-ack'&&type!=='ack'&&type!=='vender-ack'&&type!=='comanda-status-ack'&&type!=='order-update-ack')message(row.mensaje)}catch(e){}}var t=Date.parse(row.created_at||'');if(t)lastRecoveryAt=Math.max(lastRecoveryAt,t)});
localStorage.setItem('argentas_supabase_last_recovery',String(Math.max(lastRecoveryAt,Date.now()-30000)));
}catch(e){console.warn('Argentas Supabase recovery error',e)}
}

async function recoverStatusRecent(){
try{
var since=Number(localStorage.getItem('argentas_supabase_status_recovery')||0),cutoff=Math.max(since-120000,Date.now()-7*24*60*60*1000);
var q=SUPABASE_URL+'/rest/v1/'+STATUS_TABLE+'?select=event_id,order_id,status,status_updated_at,device_id,created_at&created_at=gt.'+encodeURIComponent(new Date(cutoff).toISOString())+'&order=created_at.asc&limit=1000';
var res=await fetch(q,{headers:{'apikey':SUPABASE_KEY}});if(!res.ok)throw new Error('HTTP '+res.status);
var rows=await res.json(),maxAt=since;
rows.forEach(function(row){var sender=String(row.device_id||'');if(sender&&sender!==DEVICE_ID&&typeof window.onArgentasStatusMessage==='function')window.onArgentasStatusMessage(row);var t=Date.parse(row.created_at||'');if(t)maxAt=Math.max(maxAt,t)});
localStorage.setItem('argentas_supabase_status_recovery',String(Math.max(maxAt,Date.now()-30000)));
}catch(e){console.warn('Argentas status recovery error',e)}
}
function stopHeartbeat(){if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null}}
function schedule(){if(closing||reconnectTimer)return;reconnectTimer=setTimeout(function(){reconnectTimer=null;connect()},3000)}
function connect(){
closing=false;if(ws){try{ws.close()}catch(e){}ws=null}joined=false;stopHeartbeat();state('CONECTANDO','Conectando con Supabase…');
var url=SUPABASE_URL.replace(/^https:/,'wss:')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SUPABASE_KEY)+'&vsn=1.0.0';
try{ws=new WebSocket(url)}catch(e){state('DESCONECTADO','No se pudo abrir Supabase');schedule();return}
ws.onopen=function(){ws.send(JSON.stringify({topic:'realtime:argentas-conexion',event:'phx_join',payload:{config:{broadcast:{ack:false,self:false},presence:{enabled:false},postgres_changes:[{event:'INSERT',schema:'public',table:SUPABASE_TABLE},{event:'INSERT',schema:'public',table:STATUS_TABLE}]},user_token:SUPABASE_KEY},ref:'1',join_ref:'1'}))};
ws.onmessage=function(ev){try{var m=JSON.parse(ev.data);
if(m.event==='phx_reply'&&m.payload&&m.payload.status==='ok'){joined=true;state('CONECTADO','Conectado a Supabase · '+DEVICE_ROLE);stopHeartbeat();heartbeatTimer=setInterval(function(){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:String(Date.now())}))},25000);recoverRecent();recoverStatusRecent();return}
if(m.event==='system'&&m.payload&&m.payload.status==='ok'){joined=true;state('CONECTADO','Conectado a Supabase · '+DEVICE_ROLE);recoverRecent();recoverStatusRecent();return}
if(m.event==='postgres_changes'&&m.payload&&m.payload.data&&m.payload.data.record){
var row=m.payload.data.record,table=String(m.payload.data.table||'');
if(table===STATUS_TABLE){var senderStatus=String(row.device_id||'');if(senderStatus!==DEVICE_ID&&typeof window.onArgentasStatusMessage==='function')window.onArgentasStatusMessage(row)}
else{var sender=String(row.device_id||''),same=sender?sender===DEVICE_ID:String(row.dispositivo||'')===DEVICE_ROLE;if(!same&&row.mensaje)message(row.mensaje)}
}
}catch(e){}};
ws.onerror=function(){state('DESCONECTADO','Error de conexión con Supabase')};
ws.onclose=function(){joined=false;stopHeartbeat();if(!closing){state('CONECTANDO','Reconectando con Supabase…');schedule()}};
}
window.ArgentasSupabaseTransport={
  connect:connect,
  send:function(raw){
    if(!raw)return Promise.resolve();
    return postMessage(String(raw)).catch(function(e){console.warn('Argentas Supabase send error',e);state('CONECTADO','Conectado · envío pendiente');throw e});
  },
  sendStatus:function(ev){return postStatus(ev)},
  recover:recoverRecent,
  recoverStatus:recoverStatusRecent,
  getDeviceId:function(){return DEVICE_ID}
};

setTimeout(connect,50);
})();
</script>
